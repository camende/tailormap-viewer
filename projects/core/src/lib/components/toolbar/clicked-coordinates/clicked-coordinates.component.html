<ng-template #clickedCoordinatesContent>
  <div class="clicked-coordinates-field-wrapper">

    <form [formGroup]="coordinatesForm" class="clicked-coordinates-inputs">
      <mat-form-field appearance="outline" color="primary" [style.width.em]="12.5">
        <mat-label>{{ getFirstCoordinateLabel() }}</mat-label>
        <input matInput type="text" inputmode="decimal" formControlName="x"/>
      </mat-form-field>
      <mat-form-field appearance="outline" color="primary" [style.width.em]="12.5">
        <mat-label>{{ getSecondCoordinateLabel() }}</mat-label>
        <input matInput type="text" inputmode="decimal" formControlName="y"/>
      </mat-form-field>

      <div class="clicked-coordinates-buttons">
        <button mat-flat-button
                (click)="copy()"
                [disabled]="coordinatesForm.invalid"
                i18n-tmTooltip="@@core.toolbar.coordinate-picker-copy"
                tmTooltip="Copy"
                class="map-control-button toggle-button--active">
          <mat-icon svgIcon="copy"></mat-icon>
        </button>

        <button mat-flat-button
                (click)="goTo()"
                [disabled]="coordinatesForm.invalid"
                i18n-tmTooltip="@@core.toolbar.coordinate-picker-zoomTo"
                tmTooltip="Zoom To"
                class="map-control-button toggle-button--active">
          <mat-icon svgIcon="show_position"></mat-icon>
        </button>
      </div>
    </form>

    @if (coordinatesForm.dirty && coordinatesForm.invalid) {
      <tm-error-message
        [message]="getErrorMessage()"
        [friendlyError]="true"></tm-error-message>
    }
  </div>
</ng-template>

@if ((visible$ | async) && !noExpansionPanel()) {
  <div [class.clicked-coordinates-container--is-active]="toolActive()"
       class="clicked-coordinates-container map-control-button-container"
       (keyup.escape)="toggle()">

    <button (click)="toggle()"
            [class.toggle-button--active]="toolActive()"
            class="map-control-button toggle-button"
            i18n-tmTooltip="@@core.toolbar.coordinate-picker"
            mat-flat-button
            tmTooltip="Coordinate picker">
      <mat-icon svgIcon="tools_push_pin"></mat-icon>
    </button>

    @if (toolActive()) {
      <ng-container *ngTemplateOutlet="clickedCoordinatesContent"></ng-container>
    }

  </div>
} @else if (visible$ | async) {
  <div class="clicked-coordinates-no-expansion-panel">
    <ng-container *ngTemplateOutlet="clickedCoordinatesContent"></ng-container>
  </div>
}
